{{define "base"}}<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,600;1,400;1,600&display=swap"
			rel="stylesheet"
		/>
        <script defer src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
		<link rel="stylesheet" href="/vendor/highlight/theme.min.css" />
		<link rel="stylesheet" href="/styles.css" />
		<title>{{template "title" .}}</title>
		{{template "meta" .}}
	</head>
	<body>
		<script>
			(function(){var t=localStorage.getItem('theme');if(t==='light'){document.body.classList.add('theme-light');}else{document.body.classList.add('theme-dark');}if(localStorage.getItem('noimages')==='1'){document.body.classList.add('no-images');}})();
		</script>
		<a href="#main" class="skip-to-main-content">Skip to main content</a>
{{template "content" .}}
		<div id="command-palette-root"></div>
		<div id="modal-root"></div>
{{template "footer" .}}
		<script src="/vendor/lucide/lucide.min.js"></script>
		<script src="/borum-loader.js"></script>
		<template id="code-block-tpl">
			<div class="relative group">
				<pre></pre>
				<button class="absolute top-2 right-2 flex items-center justify-center w-8 h-8 p-0 rounded-md bg-transparent text-[var(--color-muted)] hover:bg-[var(--high-background)] cursor-pointer transition-opacity" aria-label="Copy code">
					<span data-copy-idle><i data-lucide="clipboard" class="size-4"></i></span>
					<span data-copy-loading hidden><i data-lucide="loader-2" class="size-4 animate-spin"></i></span>
					<span data-copy-success hidden><i data-lucide="check" class="size-4"></i></span>
				</button>
			</div>
		</template>
		<script src="/app.js"></script>
		{{block "page_scripts" .}}{{end}}
	</body>
</html>{{end}}
