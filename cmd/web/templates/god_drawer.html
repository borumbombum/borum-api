{{define "drawer"}}
<div data-drawer-backdrop class="fixed inset-0 z-40 bg-black/20" hidden></div>
<aside data-drawer class="fixed inset-y-0 left-0 z-50 flex w-64 flex-col border-r border-hairline bg-paper p-4 transition-transform" style="transform: translateX(-100%)">
    <p class="px-3 pb-3 font-mono text-[11px] uppercase tracking-[0.12em] text-faint">god</p>
    <nav class="flex flex-col gap-1 font-mono text-[13px]">
        <a href="/god/articles" class="rounded border-b-0 px-3 py-2 text-ink-soft hover:bg-[var(--color-hairline)] hover:text-ink">/articles</a>
        <a href="/god/articles/new" class="rounded border-b-0 px-3 py-2 text-ink-soft hover:bg-[var(--color-hairline)] hover:text-ink">/articles/new</a>
        <a href="/" class="rounded border-b-0 px-3 py-2 text-ink-soft hover:bg-[var(--color-hairline)] hover:text-ink">/view site</a>
    </nav>
    <div class="mt-auto border-t border-hairline pt-2">
        <button data-logout type="button" class="flex w-full cursor-pointer items-center rounded px-3 py-2 text-left font-mono text-[13px] text-ink-soft hover:bg-[var(--color-hairline)] hover:text-ink">logout</button>
    </div>
</aside>
{{end}}
