{{define "experiment_body"}}
<div class="wrapper wrapper-wide relative !pb-2">
    <!-- Tab bar -->
    <div class="!mb-6 flex !gap-4 border-b border-hairline font-mono text-[13px]">
        <button type="button" data-tab="decode" class="cursor-pointer border-b-2 border-ink !pb-2 font-semibold text-ink">Decoding</button>
        <button type="button" data-tab="encode" class="cursor-pointer border-b-2 border-transparent !pb-2 text-faint hover:text-ink">Encoding</button>
    </div>

    <!-- Tab: Decoding -->
    <div data-panel="decode">
        <div class="flex flex-col !gap-4 !md:flex-row">
            <!-- Left: Result pane -->
            <div class="md:flex-1">
                <div id="decode-result" class="rounded border border-hairline !p-4">
                    <p class="font-mono text-[12px] text-faint">Decoded QR content will appear here.</p>
                </div>
            </div>

            <!-- Right: Two forms stacked -->
            <div class="flex flex-col !gap-4 md:flex-1">
                <!-- Form 1: File upload -->
                <div class="rounded border border-hairline !p-4">
                    <h3 class="!mb-3 font-mono text-[13px] font-semibold">Upload Image</h3>
                    <label class="flex flex-col !gap-1 font-mono text-[12px] text-ink-soft">
                        select a QR code image
                        <input id="qr-file-input" type="file" accept="image/*"
                            class="w-full border border-hairline bg-transparent !p-2 font-mono text-[13px] text-ink file:!mr-3 file:border-0 file:bg-paper-dim file:!px-3 file:!py-1.5 file:font-mono file:text-[12px] file:text-ink-soft hover:file:text-ink focus:border-ink focus:outline-none" />
                    </label>
                </div>

                <!-- Form 2: Camera capture -->
                <div class="rounded border border-hairline !p-4">
                    <h3 class="!mb-3 font-mono text-[13px] font-semibold">Take Photo</h3>
                    <div id="camera-wrap" class="!mb-3 hidden">
                        <video id="qr-camera" autoplay playsinline class="!mb-2 w-full rounded"></video>
                        <button type="button" id="qr-capture-btn" class="cursor-pointer rounded bg-ink !px-3 !py-1 font-mono text-[12px] text-paper hover:opacity-80">Capture</button>
                    </div>
                    <button type="button" id="qr-camera-btn" class="cursor-pointer rounded border border-hairline !px-3 !py-1 font-mono text-[12px] text-faint hover:text-ink">Open Camera</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Tab: Encoding -->
    <div data-panel="encode" class="hidden">
        <div class="flex flex-col !gap-4 !md:flex-row">
            <!-- Left: Input -->
            <div class="md:flex-1">
                <label class="!mb-2 block font-mono text-[13px] font-semibold">Content</label>
                <textarea id="qr-text" rows="10" placeholder="Paste or type text to encode…"
                    class="w-full resize-none rounded border border-hairline bg-transparent !p-3 font-mono text-[13px] text-ink placeholder:text-faint focus:border-ink focus:outline-none"></textarea>
            </div>

            <!-- Right: Result -->
            <div class="md:flex-1">
                <div id="encode-result" class="rounded border border-hairline !p-4">
                    <p class="font-mono text-[12px] text-faint">QR image will appear here.</p>
                </div>
            </div>
        </div>
    </div>
</div>
{{end}}
{{define "page_scripts"}}
<script src="/vendor/jsqr/jsqr.js"></script>
<script src="/vendor/qrcode/qrcode.js"></script>
<script src="/assets/experiments/02-qr-smuggler-kit/qr-smuggler-kit.js"></script>
{{end}}
